<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Numero de Seguidores</title>
  <link rel="stylesheet" href="/styles.css" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
</head>
<body>
  <div class="container">
    <header>
      <h1>Numero de Seguidores</h1>
      <p class="subtitle">Acompanhamento diario de seguidores do Instagram</p>
    </header>

    <div id="error-banner" class="error-banner" hidden></div>

    <form id="add-form" class="add-form">
      <input id="username-input" type="text" placeholder="usuario_do_instagram" autocomplete="off" required />
      <button id="add-button" type="submit">Adicionar</button>
    </form>

    <div id="empty-state" class="empty-state" hidden>
      Nenhum perfil cadastrado ainda. Adicione um usuario do Instagram acima.
    </div>

    <div id="profiles" class="profiles-grid"></div>
  </div>

  <div id="history-modal" class="modal" hidden>
    <div class="modal-content">
      <div class="modal-header">
        <h2 id="history-title">Historico</h2>
        <select id="days-select">
          <option value="7">7 dias</option>
          <option value="30" selected>30 dias</option>
          <option value="90">90 dias</option>
          <option value="365">1 ano</option>
        </select>
        <button id="close-modal" class="close-btn" type="button">Fechar</button>
      </div>
      <canvas id="history-chart" height="110"></canvas>
    </div>
  </div>

  <script src="/app.js"></script>
</body>
</html>
