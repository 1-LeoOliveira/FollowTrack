<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Numero de Seguidores</title>
  <link
    rel="icon"
    href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%232a78d6'/%3E%3Cpath d='M7 21l6-7 5 4 7-9' stroke='white' stroke-width='2.5' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E"
  />
  <link rel="stylesheet" href="/styles.css" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
</head>
<body>
  <div id="toast-stack" class="toast-stack"></div>

  <div class="container">
    <header>
      <h1>Numero de Seguidores</h1>
      <p class="subtitle">Acompanhamento diario de seguidores do Instagram</p>
    </header>

    <div id="stats-row" class="stats-row" hidden></div>

    <form id="apikey-form" class="apikey-form" hidden>
      <label for="apikey-input">API key</label>
      <input id="apikey-input" type="password" placeholder="cole sua API_KEY aqui" autocomplete="off" />
      <button id="apikey-button" type="submit">Salvar</button>
    </form>
    <button id="apikey-toggle" type="button" class="apikey-toggle" hidden>trocar API key</button>

    <form id="add-form" class="add-form">
      <input id="username-input" type="text" placeholder="usuario_do_instagram" autocomplete="off" required />
      <button id="add-button" type="submit">Adicionar</button>
    </form>

    <div class="toolbar">
      <input id="search-input" type="search" placeholder="Buscar por usuario..." autocomplete="off" />
      <select id="sort-select">
        <option value="createdAt-desc">Mais recentes</option>
        <option value="followers-desc">Mais seguidores</option>
        <option value="followers-asc">Menos seguidores</option>
        <option value="delta-desc">Maior crescimento</option>
        <option value="delta-asc">Maior queda</option>
        <option value="username-asc">Nome (A-Z)</option>
      </select>
    </div>

    <div id="compare-bar" class="compare-bar" hidden>
      <span id="compare-count">0 selecionados</span>
      <div style="display: flex; gap: 8px">
        <button id="compare-button" type="button" class="secondary">Comparar</button>
        <button id="compare-clear" type="button" class="secondary">Limpar</button>
      </div>
    </div>

    <div id="empty-state" class="empty-state" hidden>
      Nenhum perfil cadastrado ainda. Adicione um usuario do Instagram acima.
    </div>

    <div id="skeleton" class="profiles-grid" hidden>
      <div class="skeleton-card">
        <div class="skeleton-bar" style="width: 44px; height: 44px; border-radius: 50%; margin-bottom: 14px"></div>
        <div class="skeleton-bar" style="width: 70%; height: 16px; margin-bottom: 10px"></div>
        <div class="skeleton-bar" style="width: 40%; height: 26px; margin-bottom: 14px"></div>
        <div class="skeleton-bar" style="width: 100%; height: 40px"></div>
      </div>
      <div class="skeleton-card">
        <div class="skeleton-bar" style="width: 44px; height: 44px; border-radius: 50%; margin-bottom: 14px"></div>
        <div class="skeleton-bar" style="width: 70%; height: 16px; margin-bottom: 10px"></div>
        <div class="skeleton-bar" style="width: 40%; height: 26px; margin-bottom: 14px"></div>
        <div class="skeleton-bar" style="width: 100%; height: 40px"></div>
      </div>
    </div>

    <div id="profiles" class="profiles-grid"></div>
  </div>

  <div id="history-modal" class="modal" hidden>
    <div class="modal-content">
      <div class="modal-header">
        <h2 id="history-title">Historico</h2>
        <select id="days-select">
          <option value="7">7 dias</option>
          <option value="30" selected>30 dias</option>
          <option value="90">90 dias</option>
          <option value="365">1 ano</option>
        </select>
        <button id="csv-button" type="button" class="secondary">Baixar CSV</button>
        <button id="close-modal" class="close-btn" type="button">Fechar</button>
      </div>
      <canvas id="history-chart" height="110"></canvas>
      <div id="modal-legend" class="modal-legend" hidden></div>
    </div>
  </div>

  <script src="/app.js"></script>
</body>
</html>
